<aside class="sidebar-shell">
    <div class="brand-row">
        <div class="brand-icon">
            <img src="logo.png" alt="" />
        </div>
        <div>
            <span class="brand-name">Slipper</span>
            <span class="brand-subtitle">Admin console</span>
        </div>
    </div>

    <nav class="sidebar-nav" aria-label="Main navigation">
        <p class="nav-label">Workspace</p>
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
            <i class="uil uil-estate"></i>
            <span>Dashboard</span>
        </a>
        <a routerLink="/products" routerLinkActive="active" class="nav-link">
            <i class="uil uil-box"></i>
            <span>Products</span>
        </a>
        <a routerLink="/orders" routerLinkActive="active" class="nav-link">
            <i class="uil uil-shopping-bag"></i>
            <span>Orders</span>
        </a>
        <a routerLink="/customers" routerLinkActive="active" class="nav-link">
            <i class="uil uil-users-alt"></i>
            <span>Customers</span>
        </a>
    </nav>

    @if (user$ | async; as user) {
        <div class="account-panel">
            <div class="account-profile">
                <div class="avatar">
                    @if (profilePhoto(user); as photoUrl) {
                        @if (!avatarFailed) {
                            <img [src]="photoUrl" [alt]="displayName(user)" (error)="onAvatarError()" />
                        } @else {
                            <span>{{ initials(user) }}</span>
                        }
                    } @else {
                        <span>{{ initials(user) }}</span>
                    }
                    <span class="online-dot" aria-label="Signed in"></span>
                </div>
                <div class="account-copy">
                    <strong>{{ displayName(user) }}</strong>
                    <span>{{ user.email }}</span>
                </div>
            </div>

            <button type="button" (click)="onLogout()" class="logout-button" title="Log out">
                <i class="uil uil-signout"></i>
                <span>Logout</span>
            </button>
        </div>
    }
</aside>
