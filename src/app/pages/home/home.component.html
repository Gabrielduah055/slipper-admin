<div class="admin-shell min-h-screen">
    <app-sidebar class="fixed top-0 left-0 w-64 h-screen"></app-sidebar>

    <main class="ml-64 min-h-screen">
        <header class="topbar sticky top-0 z-10">
            <div class="global-search">
                <i class="uil uil-search"></i>
                <input type="search" placeholder="Search your workspace" aria-label="Search your workspace" />
                <span class="search-hint">⌘ K</span>
            </div>
            <div class="topbar-actions">
                <button type="button" aria-label="Messages"><i class="uil uil-comment-alt"></i></button>
                <button type="button" aria-label="Notifications" class="notification-button">
                    <i class="uil uil-bell"></i>
                    <span></span>
                </button>
            </div>
        </header>
        
        <div class="content-area overflow-auto">
            <router-outlet></router-outlet>
        </div>
    </main>
</div>
